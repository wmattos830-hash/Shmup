name: Build Mega Drive ROM

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      
      - name: Setup SGDK
        run: |
          cd /opt
          git clone --depth 1 https://github.com/Stephane-D/SGDK.git
          echo "GDK=/opt/SGDK" >> $GITHUB_ENV
      
      - name: Install Toolchain
        run: |
          cd /tmp
          
          # Opção 1: Release oficial mais recente do SGDK
          if wget -q --spider "https://github.com/Stephane-D/SGDK/releases/latest/download/m68k-elf-tools.tar.gz"; then
            wget -q https://github.com/Stephane-D/SGDK/releases/latest/download/m68k-elf-tools.tar.gz
            tar -xzf m68k-elf-tools.tar.gz -C /opt/
          # Opção 2: Ferramentas do projeto m68k-elf-gcc
          elif wget -q --spider "https://github.com/kubilus1/m68k-elf-gcc/releases/download/v13.2.0/m68k-elf-gcc-13.2.0-linux-x86_64.tar.gz"; then
            wget -q https://github.com/kubilus1/m68k-elf-gcc/releases/download/v13.2.0/m68k-elf-gcc-13.2.0-linux-x86_64.tar.gz
            tar -xzf m68k-elf-gcc-13.2.0-linux-x86_64.tar.gz -C /opt/
            mv /opt/m68k-elf-gcc-* /opt/m68k-elf 2>/dev/null || true
          # Opção 3: Instala via apt como último recurso
          else
            echo "Fallback: instalando gcc-m68k via apt..."
            sudo apt-get update
            sudo apt-get install -y gcc-m68k-linux-gnu binutils-m68k-linux-gnu
            mkdir -p /opt/m68k-elf/bin
            ln -sf /usr/bin/m68k-linux-gnu-gcc /opt/m68k-elf/bin/m68k-elf-gcc
            ln -sf /usr/bin/m68k-linux-gnu-as /opt/m68k-elf/bin/m68k-elf-as
            ln -sf /usr/bin/m68k-linux-gnu-ld /opt/m68k-elf/bin/m68k-elf-ld
          fi
          
          # GARANTIR QUE O COMPILADOR ESTEJA NO PATH
          echo "/opt/m68k-elf/bin" >> $GITHUB_PATH
          echo "/usr/bin" >> $GITHUB_PATH
          
          # Debug: Verificar se o compilador existe
          which m68k-elf-gcc || which m68k-linux-gnu-gcc || echo "COMPILADOR NÃO ENCONTRADO!"
      
      - name: Debug Files
        run: |
          echo "=== Estrutura de pastas ==="
          find . -type f -name "*.png" -o -name "*.res"
          echo "=== Conteúdo de resources.res ==="
          cat res/resources.res
      
      - name: Compile ROM
        run: |
          make -f $GDK/makefile.gen
      
      - name: Prepare output folder
        run: |
          mkdir -p output
          cp out/rom.bin output/rom.bin
          cp out/rom.bin output/megadrive-rom.bin
          echo "ROM compilada com sucesso!"
          ls -lh output/
      
      - name: Commit ROM to output folder
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "Nenhuma mudança na ROM"
          else
            git commit -m "🎮 Atualiza ROM compilada [skip ci]"
            git push
            echo "✅ ROM commitada em output/"
          fi
      
      - name: Upload as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: megadrive-rom
          path: output/rom.bin
          retention-days: 90
      
      - name: Create Release (apenas em tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: output/rom.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
